# Routes non-bug traffic away from public Issues.
#
# Some traffic does not belong in a public thread: CLA questions, and above
# all security reports. The new-issue chooser offers those as email links.
blank_issues_enabled: true
contact_links:
  - name: ⚖️ Licensing question
    url: mailto:marco.lombardo@gmail.com?subject=Argus
    about: >-
      Argus is AGPL-3.0 and offered under no other terms. Note that the TimesFM
      model weights are Google's, under a non-commercial licence Argus cannot
      change — see the README before asking about production use.
  - name: 📄 Contributor License Agreement (CLA) questions
    url: mailto:marco.lombardo@gmail.com?subject=Argus%20CLA
    about: Individual or Corporate CLA questions, including employer sign-off.
  - name: 🔐 Security vulnerability
    url: mailto:marco.lombardo@gmail.com?subject=Argus%20security%20report
    about: >-
      Report privately. Argus handles exchange API keys and can place live orders — please do not
      open a public issue for a security problem.
