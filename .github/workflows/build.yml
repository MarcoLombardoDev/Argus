# Builds the genuine Windows .exe on a real Windows runner.
#
# PyInstaller does not cross-compile — build.py run on this Linux/macOS
# machine only ever produces this machine's own native binary (see
# Argus.spec, CLAUDE.md). This workflow is the way to get a real .exe
# without owning a Windows machine: GitHub provides one on demand.
#
# Two triggers, two purposes:
# - workflow_dispatch: an ad-hoc test build. Uploads Argus.exe as a workflow
#   artifact, which is fine for trying the build but is neither permanent
#   (artifacts expire on GitHub's retention schedule) nor a clean public
#   download link.
# - push of a "v*" tag: a release build. Additionally publishes a GitHub
#   Release with Argus.exe attached — release assets do not expire and are
#   downloadable by anyone, logged in or not, for as long as the release
#   exists. This is the one to use for a link worth handing out.
name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # only used to create the Release on a tag push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # A GitHub-hosted runner has unrestricted internet access, unlike some
      # sandboxed dev environments — so, unlike there, the CPU-only wheel is
      # actually reachable here. Installed before requirements.txt so pip
      # finds torch already satisfied and does not pull the default (much
      # larger, GPU-only-useful) CUDA build from PyPI instead.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build Argus.exe
        run: python build.py

      - name: Upload Argus.exe as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Argus-windows-exe
          path: dist/Argus.exe
          if-no-files-found: error

      # Only on a "v*" tag push: turns the build into a permanent, public
      # download. gh is preinstalled on GitHub-hosted runners; no extra
      # action or token beyond the job's own GITHUB_TOKEN is needed.
      #
      # Fixed title and notes, not --generate-notes: GitHub's auto-generated
      # notes list every commit since the last release, which for a first
      # release is the entire project history - not a description of what's
      # being downloaded.
      #
      # `gh release create` fails outright if a release already exists for
      # this tag - which happens whenever the tag was made through GitHub's
      # own "Draft a new release" UI, since that flow creates the tag and a
      # release object (often left as a draft, sometimes with a title/body
      # GitHub filled in on its own) together. Falling back to `gh release
      # upload --clobber` attaches the exe to that existing release instead
      # of giving up, and the unconditional `gh release edit` afterwards
      # both publishes it (a draft is invisible to anonymous visitors) and
      # overwrites whatever title/notes it already had - so the two paths
      # converge on the same result instead of the fallback path silently
      # keeping a stale or empty title.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          TITLE="Argus $TAG"
          NOTES="Standalone Windows build of Argus, packaged with a CPU-only PyTorch (no NVIDIA GPU required).

          - Download \`Argus.exe\` below and run it directly - no Python install needed.
          - On first launch it creates its own \`data/\` and \`config/\` folders next to itself.
          - See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed, and [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for setup and usage."

          gh release create "$TAG" dist/Argus.exe --title "$TITLE" --notes "$NOTES" \
            || gh release upload "$TAG" dist/Argus.exe --clobber
          gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --draft=false
